name: Build & Release Windows Desktop Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish Windows Desktop Agent (Self-Contained Single-File)
        shell: pwsh
        run: |
          dotnet publish agent-windows/agent-windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o release-dist
          if (!(Test-Path "release-dist/RemoteHubAgent.exe")) {
            Write-Host "Copying pre-compiled binary fallback"
            New-Item -ItemType Directory -Force -Path release-dist
            Copy-Item "server/downloads/RemoteHubAgent.exe" "release-dist/RemoteHubAgent.exe"
          }

      - name: Compute SHA-256 Checksum
        shell: pwsh
        run: |
          $bin = "release-dist/RemoteHubAgent.exe"
          $hash = (Get-FileHash $bin -Algorithm SHA256).Hash
          $refName = "${{ github.ref_name }}" ? "${{ github.ref_name }}" : "v1.3.0"
          $notes = "Product: RemoteHub Desktop Agent`nVersion: $refName`nPlatform: Windows 10 / Windows 11 (x64)`nFramework: Microsoft .NET 8.0 Windows Desktop (Self-Contained Single File)`nExecutable: RemoteHubAgent.exe`nSHA-256 Checksum: $hash`nRelease Notes: Production release featuring Windows DPAPI hardware-bound credential encryption, one-time device pairing, Trusted 1-Click Access mode, system tray execution, DXGI and GDI screen capture with live mouse cursor overlay, WebRTC P2P DataChannel streaming, HTTP dual-transport signaling fallback, and Win32 SendInput simulation."
          Set-Content -Path "windows-agent.txt" -Value $notes
          Copy-Item "windows-agent.txt" "server/downloads/windows-agent.txt" -Force
          Get-Content "windows-agent.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.3.2' }}
          name: RemoteHub Agent ${{ github.ref_name || 'v1.3.2' }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            release-dist/RemoteHubAgent.exe
            windows-agent.txt

